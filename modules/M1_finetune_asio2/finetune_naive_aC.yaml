# M1, arm D: the silica recipe applied to AM26 amorphous carbon, with the lowest-density quarter
# of the cells held out (the most porous end). Split: data/make_splits.py --system a-C
# --group-key density --holdout min --holdout-fraction 0.25
# Run from the repository root:  mace_run_train --config modules/M1_finetune_asio2/finetune_naive_aC.yaml
# No dispersion correction is applied: AM26 labels are plain PBE and so is the base model.

name: am26_aC_mpa0_naive
seed: 0

foundation_model: models_cache/mace-mpa-0-medium.model
multiheads_finetuning: False

train_file: data/splits/a-C/train.xyz
valid_file: data/splits/a-C/valid.xyz
test_file: data/splits/a-C/test.xyz
energy_key: REF_energy
forces_key: REF_forces
compute_stress: False

E0s: estimated
loss: universal
energy_weight: 1.0
forces_weight: 10.0
stress_weight: 0.0

batch_size: 2
valid_batch_size: 2
max_num_epochs: 150
lr: 0.0005
weight_decay: 0.0
ema: True
ema_decay: 0.99
scheduler_patience: 10
patience: 40
eval_interval: 1
error_table: PerAtomRMSE
clip_grad: 10.0

default_dtype: float64
device: cuda
save_cpu: True
restart_latest: True

results_dir: modules/M1_finetune_asio2/results
checkpoints_dir: modules/M1_finetune_asio2/checkpoints
model_dir: modules/M1_finetune_asio2/checkpoints
log_dir: modules/M1_finetune_asio2/logs
