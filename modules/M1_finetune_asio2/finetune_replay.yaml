# M1, arm B: multihead replay fine-tuning of MACE-MPA-0 on the same split as arm A.
# Run from the repository root:  mace_run_train --config modules/M1_finetune_asio2/finetune_replay.yaml
# Replay keeps a head on a subsample of the pretraining data (pt_train_file: mp downloads it) so the
# model does not forget the foundation distribution. Compare with arm A on the same held-out cells;
# Tompa et al. recommend replay when robustness outside the fine-tuning distribution matters.
# The full 150-epoch run stopped at epoch 32 without evaluation. The evaluated run is this file with
# max_num_epochs=30 and num_samples_pt=1000 (name am26_asio2_mpa0_replay_short).
# Check the E0s choice against the multihead fine-tuning guide:
# https://mace-docs.readthedocs.io/en/latest/guide/multihead_finetuning.html

name: am26_asio2_mpa0_replay
seed: 0

foundation_model: models_cache/mace-mpa-0-medium.model   # downloaded by the job script; see models.yaml for the URL
multiheads_finetuning: True
pt_train_file: mp                     # replay set subsampled from MPtrj by MACE

train_file: data/splits/a-SiO2/train.xyz
valid_file: data/splits/a-SiO2/valid.xyz
test_file: data/splits/a-SiO2/test.xyz
energy_key: REF_energy
forces_key: REF_forces
compute_stress: False

E0s: estimated
loss: universal
energy_weight: 1.0
forces_weight: 10.0
stress_weight: 0.0

batch_size: 2
valid_batch_size: 2
max_num_epochs: 150
lr: 0.0005
weight_decay: 0.0
ema: True
ema_decay: 0.99
scheduler_patience: 10
patience: 40
eval_interval: 1
error_table: PerAtomRMSE
clip_grad: 10.0

default_dtype: float64
device: cuda
save_cpu: True
restart_latest: True

results_dir: modules/M1_finetune_asio2/results
checkpoints_dir: modules/M1_finetune_asio2/checkpoints
model_dir: modules/M1_finetune_asio2/checkpoints
log_dir: modules/M1_finetune_asio2/logs
