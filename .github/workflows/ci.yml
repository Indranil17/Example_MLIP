name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: No structure files or absolute paths
        run: bash tools/check_repo.sh
      - name: Tests (CPU, no data, no network)
        run: pytest -q
      - name: Notebook runs from the committed files alone
        run: |
          pip install -e ".[notebook]"
          jupyter nbconvert --to notebook --execute notebooks/tour.ipynb --output tour_ci.ipynb --output-dir "$RUNNER_TEMP" --ExecutePreprocessor.timeout=900
